name: Release npm package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact prepared version in package.json
        required: true
        type: string
      publish:
        description: Publish after checks and protected-environment approval
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
      version: ${{ steps.package.outputs.version }}
      commit: ${{ steps.package.outputs.commit }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.11.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Verify and build one release artifact
        id: package
        run: npm run verify
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: npm-release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 7
  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
      EXPECTED_SHA256: ${{ needs.prepare.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install --global npm@11.11.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: release/
      - run: npm run release:check
      - run: npm run test:artifact
  publish:
    if: inputs.publish
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
      EXPECTED_SHA256: ${{ needs.prepare.outputs.sha256 }}
    steps:
      - name: Require configured publication gate
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: node -e "if (process.env.NPM_PUBLISH_ENABLED !== 'true') throw new Error('Configure required reviewers and the npm environment before enabling publication')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.11.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: release/
      - run: npm run release:check
      - name: Publish the approved tarball with npm trusted publishing
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: npm run release:publish
